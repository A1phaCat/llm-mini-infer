[project]
name = "llm-mini-infer-tools"
version = "0.1.0"
description = "llm-mini-infer's pinned command-line tools (fetch_tools.py: helm, kind, kubeconform, kubectl, gh)."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false
# A project of its own, locked in tools/uv.lock, apart from the package's (the image needs nothing from tools/); the
# root's two platforms
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'",
                "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
# tools/'s own tests, in tools/'s environment: uv run --project tools --locked pytest tools/tests -q -p no:cacheprovider
testpaths = ["tests"]
addopts = "-ra"
