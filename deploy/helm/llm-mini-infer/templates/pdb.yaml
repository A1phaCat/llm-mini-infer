{{- if .Values.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "llm-mini-infer.fullname" . }}
  labels:
    {{- include "llm-mini-infer.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "llm-mini-infer.selectorLabels" . | nindent 6 }}
{{- end }}
