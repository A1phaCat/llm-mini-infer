{{- $fullName := include "llm-mini-infer.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "llm-mini-infer.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "llm-mini-infer.selectorLabels" . | nindent 4 }}
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: http
{{- if .Values.service.headless }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-headless
  labels:
    {{- include "llm-mini-infer.labels" . | nindent 4 }}
    app.kubernetes.io/component: endpoints
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    {{- include "llm-mini-infer.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ include "llm-mini-infer.port" . }}
      protocol: TCP
      targetPort: http
{{- end }}
