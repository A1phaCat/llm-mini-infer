{{- if .Values.serviceMonitor.enabled -}}
# /metrics with the vllm:* series (docs/operations.md, "Metrics"), scraped from the main Service (not the headless one)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "llm-mini-infer.fullname" . }}
  labels:
    {{- include "llm-mini-infer.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: http
      path: /metrics
      {{- with .Values.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
  selector:
    matchLabels:
      {{- include "llm-mini-infer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
